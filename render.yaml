# Render Blueprint: backend (NestJS) + PostgreSQL
databases:
  - name: otop-db
    plan: free

services:
  - type: web
    name: otop-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build && npx prisma migrate deploy && npx prisma db seed
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: otop-db
          property: connectionString
